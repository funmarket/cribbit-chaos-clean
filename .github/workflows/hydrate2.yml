name: Hydrate frozen P1 payload
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify frozen P1 files
        run: |
          cat .p1/chunks/* | tr -cd 'A-Za-z0-9+/=' > /tmp/p1.b64
          base64 -d /tmp/p1.b64 > /tmp/p1.tgz
          tar -xzf /tmp/p1.tgz
          test "$(git hash-object docs/rule-provenance.json)" = "2722560cb96ad2a1d8b6dc667431cf8bbe75c5a9"
          test "$(git hash-object gamerules.md)" = "139bd96b7ddc01825bdec80cb319a04db94ac8a2"
          test "$(git hash-object package-lock.json)" = "41f91b59dc1314f9b6f1a976220139fe314e6a96"
          test "$(git hash-object tests/architecture.test.mjs)" = "4e581dd7d2987bbe9d7846f8817518a6e3a3f9d2"
          test "$(git hash-object tools/architecture/check.mjs)" = "5e067c104f57429cb92b45be3ad97f359860ac69"
          test "$(git hash-object tools/architecture/policy.mjs)" = "689b495fa860a84467bf1b89422d0960eac50c98"
          test "$(git hash-object tools/build.mjs)" = "2917df2934e002253364a785a8aca23c9fbaa62d"
          rm -rf .p1
          rm -f .github/p1-ci-trigger
          rm -f .github/workflows/hydrate.yml
          rm -f .github/workflows/hydrate2.yml
      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: close frozen P1 publication gap"
          git push
