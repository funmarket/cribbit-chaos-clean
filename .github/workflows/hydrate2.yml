name: Diagnose frozen P1 payload
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect chunk boundaries
        shell: bash
        run: |
          set -eu
          for f in .p1/chunks/*; do
            echo "FILE=$f"
            wc -c "$f"
            head -c 12 "$f"; echo
            tail -c 16 "$f"; echo
          done
          cat .p1/chunks/* | wc -c
