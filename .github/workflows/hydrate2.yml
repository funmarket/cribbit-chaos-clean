name: Diagnose frozen P1 payload
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map segment identity
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          files=sorted(Path('.p1/chunks').iterdir())
          data={p.name:p.read_text() for p in files}
          for name,s in data.items():
              print(f'{name} len={len(s)} sha256={hashlib.sha256(s.encode()).hexdigest()[:16]}')
              for off in range(0,len(s),8000):
                  part=s[off:off+8000]
                  print(f'  part off={off} len={len(part)} sha256={hashlib.sha256(part.encode()).hexdigest()[:16]} first={part[:8]} last={part[-8:]}')
          names=list(data)
          for needle_name in names:
              needle=data[needle_name]
              for hay_name in names:
                  if needle_name==hay_name: continue
                  start=0
                  while True:
                      pos=data[hay_name].find(needle,start)
                      if pos<0: break
                      print(f'CONTAINS {hay_name}[{pos}:{pos+len(needle)}] == {needle_name}')
                      start=pos+1
          PY
