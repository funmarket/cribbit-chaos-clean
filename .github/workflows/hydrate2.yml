name: Diagnose frozen P1 payload
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify salvageable archive content
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/p1-out
          gzip -dc .p1/remaining.tgz > /tmp/p1.tar || true
          echo "compressed_bytes=$(wc -c < .p1/remaining.tgz)"
          echo "tar_bytes=$(wc -c < /tmp/p1.tar)"
          tar -tf /tmp/p1.tar || true
          tar -xf /tmp/p1.tar -C /tmp/p1-out || true
          for spec in \
            'docs/rule-provenance.json 2722560cb96ad2a1d8b6dc667431cf8bbe75c5a9' \
            'gamerules.md 139bd96b7ddc01825bdec80cb319a04db94ac8a2' \
            'package-lock.json 41f91b59dc1314f9b6f1a976220139fe314e6a96' \
            'tests/architecture.test.mjs 4e581dd7d2987bbe9d7846f8817518a6e3a3f9d2' \
            'tools/architecture/check.mjs 5e067c104f57429cb92b45be3ad97f359860ac69' \
            'tools/architecture/policy.mjs 689b495fa860a84467bf1b89422d0960eac50c98' \
            'tools/build.mjs 2917df2934e002253364a785a8aca23c9fbaa62d'
          do
            set -- $spec
            path=$1
            expected=$2
            if [ -f "/tmp/p1-out/$path" ]; then
              actual=$(git hash-object "/tmp/p1-out/$path")
              echo "$path expected=$expected actual=$actual"
            else
              echo "$path MISSING"
            fi
          done
