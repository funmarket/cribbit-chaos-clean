name: Hydrate frozen P1 payload
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore frozen P1 files
        run: |
          cat .p1/chunks/* > /tmp/p1.b64
          base64 -d /tmp/p1.b64 > /tmp/p1.tgz
          tar -xzf /tmp/p1.tgz
          rm -rf .p1
          rm -f .github/workflows/hydrate.yml
          rm -f .github/workflows/hydrate2.yml
      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: complete frozen P1 foundation"
          git push
