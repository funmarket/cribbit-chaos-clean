name: Foundation architecture
on: [push, pull_request]
permissions:
  contents: write
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cribbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cribbit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/cribbit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@10.9.2
      - name: Assert toolchain
        run: |
          test "$(node -p "process.versions.node.split('.')[0]")" = "24"
          test "$(npm --version)" = "10.9.2"
      - name: Generate P6.5 dependency lock
        if: github.ref == 'refs/heads/phase/p6.5-cloud-infrastructure-bootstrap'
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit P6.5 dependency lock
        if: github.ref == 'refs/heads/phase/p6.5-cloud-infrastructure-bootstrap'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock wrangler dependency"
            git push origin HEAD:phase/p6.5-cloud-infrastructure-bootstrap
          fi
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: production-module-graphs
          path: artifacts/*-graph.json
