name: P1 lockfile rebaseline
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global npm@10.9.2
      - name: Assert toolchain
        run: |
          test "$(node -p "process.versions.node.split('.')[0]")" = "24"
          test "$(npm --version)" = "10.9.2"
      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Publish lockfile when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: publish rebaselined package lock"
          git push
