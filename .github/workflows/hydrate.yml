name: Hydrate frozen P1
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore frozen P1 files
        run: |
          test -f .p1/remaining.tgz
          tar -xzf .p1/remaining.tgz
          rm -f .p1/remaining.tgz
          rmdir .p1 2>/dev/null || true
          rm -f .github/workflows/hydrate.yml
      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: complete frozen P1 foundation"
          git push
